name: Release

# Push a tag like v1.0.0 to build a signed APK and attach it to a GitHub Release.
# Needs these repository secrets:
#   HELPER_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   HELPER_STORE_PASSWORD, HELPER_KEY_ALIAS, HELPER_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HELPER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::HELPER_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HELPER_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          HELPER_STORE_PASSWORD: ${{ secrets.HELPER_STORE_PASSWORD }}
          HELPER_KEY_ALIAS: ${{ secrets.HELPER_KEY_ALIAS }}
          HELPER_KEY_PASSWORD: ${{ secrets.HELPER_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          APK=zyll-photo-helper-${GITHUB_REF_NAME}.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "$GITHUB_REF_NAME" --notes "Signed release. Check the SHA-256 before installing."
